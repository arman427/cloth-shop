<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="why we cut in runs of 200">
<defs>
<linearGradient id="shade" x1="0" x2="1">
  <stop offset="0" stop-color="#000" stop-opacity=".16"/>
  <stop offset=".28" stop-color="#000" stop-opacity="0"/>
  <stop offset=".62" stop-color="#fff" stop-opacity=".08"/>
  <stop offset="1" stop-color="#000" stop-opacity=".18"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
  <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".1"/>
</linearGradient>
<pattern id="knit" width="7" height="8" patternUnits="userSpaceOnUse">
  <path d="M0 0 L3.5 6 L7 0" fill="none" stroke="#000" stroke-opacity=".1" stroke-width="1"/>
</pattern>
<pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
  <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-opacity=".06" stroke-width="2"/>
</pattern>
<pattern id="denim" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
  <line x1="0" y1="0" x2="0" y2="4" stroke="#fff" stroke-opacity=".09" stroke-width="1.2"/>
</pattern>
<pattern id="rib" width="6" height="10" patternUnits="userSpaceOnUse">
  <line x1="3" y1="0" x2="3" y2="10" stroke="#000" stroke-opacity=".22" stroke-width="1.2"/>
</pattern>
<pattern id="quilt" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <path d="M0 0 H36 M0 0 V36" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="3 2"/>
</pattern>
<pattern id="cable" width="28" height="34" patternUnits="userSpaceOnUse">
  <path d="M7 0 Q21 8.5 7 17 Q-7 25.5 7 34 M21 0 Q7 8.5 21 17 Q35 25.5 21 34" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="2.2"/>
</pattern>
<pattern id="linen" width="5" height="5" patternUnits="userSpaceOnUse">
  <path d="M0 1.5 H5 M1 0 V5" stroke="#000" stroke-opacity=".05" stroke-width="1"/>
</pattern>
<pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse">
  <circle cx="3" cy="4" r="1" fill="#000" fill-opacity=".08"/>
  <circle cx="10" cy="9" r="1.2" fill="#000" fill-opacity=".06"/>
  <circle cx="6" cy="12" r=".8" fill="#fff" fill-opacity=".08"/>
</pattern>
<pattern id="grid-paper" width="96" height="96" patternUnits="userSpaceOnUse">
  <path d="M0 0 H96 M0 0 V96" fill="none" stroke="#2c44d8" stroke-opacity=".1" stroke-width="1"/>
  <path d="M24 0 V96 M48 0 V96 M72 0 V96 M0 24 H96 M0 48 H96 M0 72 H96" fill="none" stroke="#2c44d8" stroke-opacity=".045" stroke-width="1"/>
</pattern>
<pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M0 0 H32 M0 0 V32" fill="none" stroke="#7c8cff" stroke-opacity=".09" stroke-width="1"/>
</pattern>
<filter id="drop" x="-25%" y="-20%" width="150%" height="150%">
  <feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="rgb(60 40 10)" flood-opacity=".18"/>
</filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
  <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgb(20 24 31)" flood-opacity=".14"/>
</filter>
<radialGradient id="floor" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#000" stop-opacity=".16"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient></defs>
<rect width="1600" height="1200" fill="#e6dfd1"/><rect width="1600" height="1200" fill="url(#grid-paper)" opacity=".6"/>
<ellipse cx="820" cy="900" rx="560" ry="60" fill="url(#floor)"/><path d="M380 820 L1180 820 L1240 880 L440 880 Z" fill="#1F2A44" stroke="#000" stroke-opacity=".2"/><path d="M386 790 L1186 790 L1246 850 L446 850 Z" fill="#B58B5A" stroke="#000" stroke-opacity=".2"/><path d="M392 760 L1192 760 L1252 820 L452 820 Z" fill="#6B6B3A" stroke="#000" stroke-opacity=".2"/><path d="M398 730 L1198 730 L1258 790 L458 790 Z" fill="#B5532F" stroke="#000" stroke-opacity=".2"/><path d="M404 700 L1204 700 L1264 760 L464 760 Z" fill="#D9CDB4" stroke="#000" stroke-opacity=".2"/><path d="M410 670 L1210 670 L1270 730 L470 730 Z" fill="#3A3D42" stroke="#000" stroke-opacity=".2"/><path d="M416 640 L1216 640 L1276 700 L476 700 Z" fill="#1F2A44" stroke="#000" stroke-opacity=".2"/><path d="M422 610 L1222 610 L1282 670 L482 670 Z" fill="#B58B5A" stroke="#000" stroke-opacity=".2"/><path d="M428 580 L1228 580 L1288 640 L488 640 Z" fill="#6B6B3A" stroke="#000" stroke-opacity=".2"/><path d="M434 550 L1234 550 L1294 610 L494 610 Z" fill="#B5532F" stroke="#000" stroke-opacity=".2"/><path d="M440 520 L1240 520 L1300 580 L500 580 Z" fill="#D9CDB4" stroke="#000" stroke-opacity=".2"/><path d="M446 490 L1246 490 L1306 550 L506 550 Z" fill="#3A3D42" stroke="#000" stroke-opacity=".2"/><path d="M452 460 L1252 460 L1312 520 L512 520 Z" fill="#1F2A44" stroke="#000" stroke-opacity=".2"/><path d="M458 430 L1258 430 L1318 490 L518 490 Z" fill="#B58B5A" stroke="#000" stroke-opacity=".2"/>
<path d="M1190 430 Q1260 380 1300 300" fill="none" stroke="#7a5a3c" stroke-width="3"/>
<g transform="translate(1250 160) rotate(12)"><rect width="220" height="140" rx="14" fill="#f4f3ee" stroke="#14181F" stroke-opacity=".3" filter="url(#soft)"/>
<circle cx="30" cy="70" r="10" fill="none" stroke="#14181F" stroke-opacity=".4" stroke-width="3"/>
<text x="130" y="96" text-anchor="middle" font-size="76" font-weight="700" fill="#14181f" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif">200</text></g>
<g transform="translate(240 260) rotate(24)" fill="none" stroke-linecap="round">
  <path d="M0 0 L180 -40 M0 0 L180 40" stroke="#9aa0a8" stroke-width="10"/>
  <circle cx="-40" cy="-28" r="30" stroke="#14181F" stroke-width="12"/><circle cx="-40" cy="28" r="30" stroke="#14181F" stroke-width="12"/>
  <circle cx="0" cy="0" r="5" fill="#14181F"/>
</g>
</svg>
