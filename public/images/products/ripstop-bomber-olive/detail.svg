<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Ripstop Bomber, olive, detail">
<defs>
<linearGradient id="shade" x1="0" x2="1">
  <stop offset="0" stop-color="#000" stop-opacity=".16"/>
  <stop offset=".28" stop-color="#000" stop-opacity="0"/>
  <stop offset=".62" stop-color="#fff" stop-opacity=".08"/>
  <stop offset="1" stop-color="#000" stop-opacity=".18"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
  <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".1"/>
</linearGradient>
<pattern id="knit" width="7" height="8" patternUnits="userSpaceOnUse">
  <path d="M0 0 L3.5 6 L7 0" fill="none" stroke="#000" stroke-opacity=".1" stroke-width="1"/>
</pattern>
<pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
