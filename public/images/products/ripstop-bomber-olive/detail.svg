</filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
  <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgb(20 24 31)" flood-opacity=".14"/>
</filter>
<radialGradient id="floor" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#000" stop-opacity=".16"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient></defs>
<rect width="800" height="1000" fill="#9a9a79"/>
